<!doctype html>
<!--
  ============================================================
   NINNA — página única do aplicativo (SPA)
   Tudo é montado por js/main.js dentro de <div id="app">.
   🔧 EDITAR: título/descrição (SEO), cores do navegador (theme-color), fontes.
  ============================================================
-->
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>NINNA — Cuidar de quem gera a vida</title>
  <meta name="description" content="NINNA: sua companheira digital de informação, organização e apoio emocional na gestação e no início da maternidade.">
  <meta name="theme-color" content="#FAF6EE">
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">

  <!-- Fontes: Fraunces (títulos) e Inter (interface). Sem internet, o navegador usa Georgia/system-ui. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap">

  <!-- Estilos: tokens (cores/fontes) → base → componentes → layout → páginas -->
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/layout.css">
  <link rel="stylesheet" href="/css/pages.css">
</head>
<body>
  <div id="app" aria-live="polite"></div>
  <noscript><p style="padding:2rem;font-family:sans-serif">O NINNA precisa do JavaScript ativado para funcionar.</p></noscript>
  <script type="module" src="/js/main.js"></script>
</body>
</html>
